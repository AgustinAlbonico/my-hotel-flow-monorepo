# SonarQube Project Configuration for My Hotel Flow
# ===================================================

# Project identification
sonar.projectKey=My-Hotel-Flow
sonar.projectName=My Hotel Flow
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=apps/backend/src
sonar.tests=apps/backend/test

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions - files and directories to ignore
sonar.exclusions=**/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.spec.tsx,\
  **/*.test.tsx,\
  **/test/**,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/scripts/**,\
  **/public/**,\
  **/assets/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/vite-env.d.ts,\
  **/nginx.conf,\
  **/Dockerfile

# Test exclusions - already in test paths
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

# Coverage reports
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/test/**,**/__tests__/**

# Duplications
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

# TypeScript/JavaScript specific
sonar.typescript.node=18

# Quality Gate thresholds (reference)
# sonar.qualitygate.wait=true
# sonar.qualitygate.timeout=300
